name: Build HG-680-KA HDMI console modules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hdmi-console-4.4
    paths:
      - '.github/workflows/build-hdmi-console.yml'
      - 'configs/hi3798mv310/HG-680-KA_cfg.mak'
      - 'source/msp/drv/hdmi/**'
      - 'source/msp/drv/vo/**'
      - 'source/msp/drv/hifb/**'
      - 'source/msp/drv/tde/**'
      - 'source/msp/drv/pq/**'
      - 'source/kernel/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-hdmi-console.yml'
      - 'configs/hi3798mv310/HG-680-KA_cfg.mak'
      - 'source/msp/drv/hdmi/**'
      - 'source/msp/drv/vo/**'
      - 'source/msp/drv/hifb/**'
      - 'source/msp/drv/tde/**'
      - 'source/msp/drv/pq/**'
      - 'source/kernel/**'

permissions:
  contents: read

concurrency:
  group: build-hg680ka-hdmi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hdmi-console:
    name: Linux 4.4 / MV310 display stack
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout HG-680-KA SDK
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            kmod

      - name: Build vendor Linux 4.4 display stack
        shell: bash
        run: |
          set -euo pipefail
          export SHELL=/bin/bash

          cp configs/hi3798mv310/HG-680-KA_cfg.mak cfg.mak
          source ./env.sh

          echo 'HG-680-KA HDMI console compile probe'
          echo '===================================='
          arm-histbv320-linux-gcc --version | head -n 1

          # The vendor kernel build injects source/msp/drv as drivers/msp and
          # builds MSP drivers as modules when CFG_HI_MSP_BUILDIN is not set.
          make linux -j"$(nproc)"

          KERNEL_SRC="$GITHUB_WORKSPACE/source/kernel/linux-4.4.y"
          KERNEL_OUT="$(find "$GITHUB_WORKSPACE/out" -type d -path '*/obj/source/kernel/linux-4.4.y' -print -quit)"
          KMOD_DIR="$(find "$GITHUB_WORKSPACE/out" -type d -path '*/kmod' -print -quit)"

          test -d "$KERNEL_OUT"
          test -d "$KMOD_DIR"

          KERNEL_RELEASE="$(make -s -C "$KERNEL_SRC" O="$KERNEL_OUT" ARCH=arm CROSS_COMPILE=arm-histbv320-linux- kernelrelease)"
          echo "Kernel release: $KERNEL_RELEASE"
          echo "Kernel output:  $KERNEL_OUT"
          echo "Module output:  $KMOD_DIR"

          mkdir -p "$GITHUB_WORKSPACE/hdmi-artifacts/modules"
          REPORT="$GITHUB_WORKSPACE/hdmi-artifacts/HDMI-MODULE-REPORT.txt"

          {
            echo "HG-680-KA vendor Linux 4.4 HDMI/fbcon compile probe"
            echo "Kernel release: $KERNEL_RELEASE"
            echo
          } > "$REPORT"

          # Minimum display path for framebuffer console:
          # PQ -> HDMI -> VO -> TDE -> HIFB.  Runtime dependency ordering will
          # be refined from modinfo and actual hardware logs; this CI phase is
          # intentionally compile/link validation only.
          for module in hi_pq hi_hdmi hi_vou hi_tde hi_fb; do
            ko="$KMOD_DIR/$module.ko"
            if [ ! -f "$ko" ]; then
              echo "ERROR: required display module missing: $ko" | tee -a "$REPORT"
              echo 'Available vendor modules:' | tee -a "$REPORT"
              find "$KMOD_DIR" -maxdepth 1 -type f -name '*.ko' -printf '%f\n' | sort | tee -a "$REPORT"
              exit 1
            fi

            cp "$ko" "$GITHUB_WORKSPACE/hdmi-artifacts/modules/"
            {
              echo "[$module.ko]"
              echo "vermagic: $(modinfo -F vermagic "$ko")"
              echo "depends:  $(modinfo -F depends "$ko")"
              echo "description: $(modinfo -F description "$ko")"
              echo
            } | tee -a "$REPORT"
          done

          # All five modules must match the kernel we just built.
          for ko in "$GITHUB_WORKSPACE"/hdmi-artifacts/modules/*.ko; do
            modinfo -F vermagic "$ko" | grep -F "$KERNEL_RELEASE"
          done

          sha256sum "$GITHUB_WORKSPACE"/hdmi-artifacts/modules/*.ko \
            > "$GITHUB_WORKSPACE/hdmi-artifacts/SHA256SUMS"

          echo
          cat "$REPORT"
          cat "$GITHUB_WORKSPACE/hdmi-artifacts/SHA256SUMS"

      - name: Upload HDMI compile-probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HG-680-KA-HDMI-console-modules-${{ github.sha }}
          path: hdmi-artifacts/
          if-no-files-found: error
          retention-days: 14
