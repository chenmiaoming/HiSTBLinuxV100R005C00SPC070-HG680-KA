name: Build HG-680-KA Linux kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-kernel.yml
      - env.sh
      - base.mak
      - cfg.mak
      - configs/hi3798mv310/**
      - source/kernel/**
      - source/common/drv/**
      - source/msp/drv/**
      - source/component/wifi/**
      - source/component/bluetooth/**
      - tools/linux/toolchains/arm-histbv320-linux/**
      - tools/linux/utils/**
  pull_request:
    paths:
      - .github/workflows/build-kernel.yml
      - env.sh
      - base.mak
      - cfg.mak
      - configs/hi3798mv310/**
      - source/kernel/**
      - source/common/drv/**
      - source/msp/drv/**
      - source/component/wifi/**
      - source/component/bluetooth/**

permissions:
  contents: read

concurrency:
  group: build-hg680ka-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: HG-680-KA / ARMv7 / arm-histbv320
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout HG-680-KA SDK
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev

      - name: Build HG-680-KA Linux kernel
        shell: bash
        run: |
          set -euo pipefail
          export SHELL=/bin/bash

          # Use the board-specific profile. It inherits the vendor MV310
          # baseline and merges hg680-ka.config into the kernel configuration.
          cp configs/hi3798mv310/HG-680-KA_cfg.mak cfg.mak

          source ./env.sh

          echo "Board profile: HG-680-KA"
          echo "Toolchain:"
          arm-histbv320-linux-gcc --version | head -n 1
          echo "Parallel jobs: $(nproc)"

          make linux -j"$(nproc)"

      - name: Verify HG-680-KA kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          KCONFIG="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/.config' -print -quit)"
          test -n "$KCONFIG"

          grep -Fx 'CONFIG_LOCALVERSION="-HG680-KA"' "$KCONFIG"
          grep -Fx '# CONFIG_USB_STORAGE_DEBUG is not set' "$KCONFIG"
          grep -Fx 'CONFIG_EXT4_FS=y' "$KCONFIG"
          grep -Fx 'CONFIG_MMC=y' "$KCONFIG"
          grep -Fx 'CONFIG_HIMCIV300_SDIO_SYNOPSYS=y' "$KCONFIG"
          grep -Fx 'CONFIG_HG680KA_SDIO_DETECT=m' "$KCONFIG"
          grep -Fx '# CONFIG_MMC_DW is not set' "$KCONFIG"
          grep -Fx 'CONFIG_CFG80211=y' "$KCONFIG"
          grep -Fx 'CONFIG_SECCOMP=y' "$KCONFIG"
          grep -Fx 'CONFIG_SECCOMP_FILTER=y' "$KCONFIG"

          echo "Verified board-specific kernel configuration:"
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_EXT4_FS=|CONFIG_MMC=|CONFIG_HIMCIV300_SDIO_SYNOPSYS=|CONFIG_HG680KA_SDIO_DETECT=|CONFIG_CFG80211=|CONFIG_SECCOMP=|CONFIG_SECCOMP_FILTER=|# CONFIG_MMC_DW|# CONFIG_USB_STORAGE_DEBUG)' "$KCONFIG"

      - name: Verify Phase A SDIO artifacts
        shell: bash
        run: |
          set -euo pipefail

          DTB="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/arch/arm/boot/dts/hi3798mv310.dtb' -print -quit)"
          DTC="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/scripts/dtc/dtc' -print -quit)"
          SDIO_HELPER="$(find out -type f -name 'hi_sdio_detect.ko' -print -quit)"

          test -n "$DTB"
          test -n "$DTC"
          test -n "$SDIO_HELPER"

          "$DTC" -I dtb -O dts "$DTB" > /tmp/hi3798mv310-HG680-KA.dts

          grep -Fq 'FiberHome HG-680-KA' /tmp/hi3798mv310-HG680-KA.dts
          grep -Fq 'fiberhome,hg680-ka-sdio-power' /tmp/hi3798mv310-HG680-KA.dts
          grep -Fq 'hi3798mv310,himciv200' /tmp/hi3798mv310-HG680-KA.dts
          grep -Fq 'wlan-reg-on-gpios' /tmp/hi3798mv310-HG680-KA.dts
          grep -Fq 'f9c40000' /tmp/hi3798mv310-HG680-KA.dts

          if grep -Fq 'realtek,rtl8822cs' /tmp/hi3798mv310-HG680-KA.dts; then
            echo 'Unexpected RTL8822CS Wi-Fi node remains in the compiled HG-680-KA DTB' >&2
            exit 1
          fi
          if grep -Fq 'realtek,rtl8822cs-bt' /tmp/hi3798mv310-HG680-KA.dts; then
            echo 'Unexpected RTL8822CS Bluetooth node remains in the compiled HG-680-KA DTB' >&2
            exit 1
          fi

          echo "Phase A helper module: $SDIO_HELPER"
          file "$SDIO_HELPER"
          echo "Compiled HG-680-KA SDIO nodes:"
          grep -n -E 'FiberHome HG-680-KA|fiberhome,hg680-ka-sdio-power|hi3798mv310,himciv200|wlan-reg-on-gpios' /tmp/hi3798mv310-HG680-KA.dts

      - name: Collect HG-680-KA kernel artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          KERNEL_BIN="$(find out -type f -path '*/image/emmc_image/hi_kernel.bin' -print -quit)"
          UIMAGE="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/arch/arm/boot/uImage' -print -quit)"
          DTB="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/arch/arm/boot/dts/hi3798mv310.dtb' -print -quit)"
          SDIO_HELPER="$(find out -type f -name 'hi_sdio_detect.ko' -print -quit)"
          KCONFIG="$(find out -type f -path '*/obj/source/kernel/linux-4.4.y/.config' -print -quit)"

          test -n "$KERNEL_BIN"
          test -n "$UIMAGE"
          test -n "$DTB"
          test -n "$SDIO_HELPER"
          test -n "$KCONFIG"

          cp "$KERNEL_BIN" artifacts/hi_kernel.bin
          cp "$UIMAGE" artifacts/uImage
          cp "$DTB" artifacts/hi3798mv310.dtb
          cp "$SDIO_HELPER" artifacts/hi_sdio_detect.ko
          cp "$KCONFIG" artifacts/HG-680-KA.config

          sha256sum \
            artifacts/hi_kernel.bin \
            artifacts/uImage \
            artifacts/hi3798mv310.dtb \
            artifacts/hi_sdio_detect.ko \
            artifacts/HG-680-KA.config \
            > artifacts/SHA256SUMS

          echo "Built artifacts:"
          ls -lh artifacts
          echo
          cat artifacts/SHA256SUMS

      - name: Upload HG-680-KA kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HG-680-KA-kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
