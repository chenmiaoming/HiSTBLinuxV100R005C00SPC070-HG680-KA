name: Build HG-680-KA Linux 6.18 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - linux-6.18-bringup
    paths:
      - 'linux-6.18/**'
      - 'scripts/hg680ka/build-linux-6.18-arm64.sh'
      - 'scripts/hg680ka/build-arm64-atf-smoke.sh'
      - 'tools/hg680ka/arm64-smoke/**'
      - 'source/kernel/arm-trusted-firmware/**'
      - '.github/workflows/build-linux-6.18-arm64.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'linux-6.18/**'
      - 'scripts/hg680ka/build-linux-6.18-arm64.sh'
      - 'scripts/hg680ka/build-arm64-atf-smoke.sh'
      - 'source/kernel/arm-trusted-firmware/**'
      - '.github/workflows/build-linux-6.18-arm64.yml'

permissions:
  contents: read

jobs:
  build-linux-6-18-arm64:
    name: Linux 6.18.46 ARM64 SMP diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout HG-680-KA bring-up inputs
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            linux-6.18
            scripts/hg680ka
            tools/hg680ka
            tools/linux/toolchains/aarch64-histbv100-linux
            source/kernel/arm-trusted-firmware
          sparse-checkout-cone-mode: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3 \
            u-boot-tools \
            xz-utils

      - name: Build Linux 6.18.46 diagnostic FIP
        shell: bash
        run: |
          set -euo pipefail
          echo "runner nproc=$(nproc)"
          lscpu | grep -E '^(CPU\(s\)|Model name|Thread|Core|Socket)' || true
          bash scripts/hg680ka/build-linux-6.18-arm64.sh "$RUNNER_TEMP/hg680ka-linux-6.18"

      - name: Upload Linux 6.18 ARM64 diagnostic artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HG-680-KA-linux-6.18.46-arm64-diag-${{ github.sha }}
          path: ${{ runner.temp }}/hg680ka-linux-6.18/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
